# 복사해서 config.toml 로 사용 (config.toml 은 git 에 올리지 않음)
device_id = "room-001"
sample_interval = 2.0
offline_grace = 2.0
db_path = "data/edge.db"
retention_days = 7
status_interval = 3.0
cloud_heartbeat_timeout = 0.0   # 클라우드가 cloud-status 를 보내기 시작하면 5.0
use_mock_devices = true   # false = 아래 [hardware] 로 실제 센서/액추에이터 사용

[mqtt]
host = "localhost"
port = 1883
# username = ""
# password = ""
tls = false
keepalive = 4
topic_prefix = "roomcare"

[thresholds]
co2_high = 1000.0
pm25_high = 35.0
pm10_high = 80.0
humidity_high = 70.0     # 초과하면 제습기 켜기
humidity_off = 60.0      # 이하가 되면 제습기 끄기 (humidity_high 보다 작아야 함)
temperature_high = 30.0

# use_mock_devices = false 일 때만 사용. hardware 레포(roomcare_hw)가 같은 venv 에 설치되어 있어야 한다.
# 액추에이터는 배선과 기구 동작을 직접 확인한 것만 true 로.
[hardware]
temperature_model = "SHT31"      # SHT31 | DHT11 | DHT22
window_motor = false
purifier = false
purifier_initial = "unknown"     # 실제 전원을 보고 on / off. unknown 이면 버튼을 누르지 않음
dehumidifier = false
dehumidifier_initial = "unknown"
door_sensor = false
door_verified = false
door_closer = false              # door_sensor, door_verified 가 true 여야 함

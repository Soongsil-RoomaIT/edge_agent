[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent"
version = "0.1.0"
description = "자취방 원격 케어 시스템 Edge Agent (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edge-agent = "edge_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
